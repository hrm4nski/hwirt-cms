<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermann Wirt — Mediendesigner Köln</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--font:'Instrument Sans',sans-serif;--dark:#0a0a0a;}
html,body{height:100%;overflow:hidden;background:var(--dark);font-family:var(--font);cursor:none;}
*{cursor:none!important;}
#cur{position:fixed;top:0;left:0;width:12px;height:12px;background:#fff;border-radius:50%;pointer-events:none;z-index:99999;mix-blend-mode:difference;transform:translate(-100px,-100px);transition:width .18s,height .18s;will-change:transform;}
#cur.big{width:36px;height:36px;}
.nav{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:500;display:flex;align-items:center;background:rgba(10,10,10,.92);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.11);border-radius:999px;overflow:hidden;}
.nav-logo{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.03em;padding:11px 20px 11px 22px;border-right:1px solid rgba(255,255,255,.1);}
.nav-logo span{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin-left:2px;vertical-align:middle;}
.nav ul{display:flex;list-style:none;}
.nav a{font-size:12px;font-weight:400;letter-spacing:.04em;color:rgba(255,255,255,.5);text-decoration:none;padding:11px 18px;display:block;transition:color .2s;}
.nav a:hover,.nav a.on{color:#fff;}
.nav-hello{font-size:12px;font-weight:600;color:#fff;background:var(--dark);padding:9px 18px;margin:4px;border-radius:999px;text-decoration:none;border:1px solid rgba(255,255,255,.15);transition:opacity .2s,transform .15s;letter-spacing:.02em;}
.nav-hello:hover{opacity:.75;transform:rotate(-2deg);}
.strip{display:flex;height:100vh;overflow:hidden;}
.panel{height:100%;flex-shrink:0;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:36px 32px;transition:flex-basis .62s cubic-bezier(.77,0,.18,1);}
.panel.intro-bg{background:#fff;}
.panel.sz-intro{flex-basis:26vw;}
.panel.sz-wide{flex-basis:22vw;}
.panel.sz-mid{flex-basis:16vw;}
.panel.sz-open{flex-basis:60vw;}
.panel.sz-thin{flex-basis:5.5vw;min-width:5.5vw;}
.c-org{background:#ea3398;}.c-pur{background:#05B2FC;}.c-yel{background:#F0E030;}.c-blu{background:#cd394a;}.c-lim{background:#2c55f6;}.c-mag{background:#c5fd61;}
.c-yel .p-num,.c-yel .p-yr,.c-yel .p-cat,.c-yel .p-title,.c-yel .p-cli,.c-yel .p-vert,
.c-mag .p-num,.c-mag .p-yr,.c-mag .p-cat,.c-mag .p-title,.c-mag .p-cli,.c-mag .p-vert{color:#0a0a0a!important;}
.c-yel .p-yr,.c-yel .p-cat,.c-yel .p-cli,.c-mag .p-yr,.c-mag .p-cat,.c-mag .p-cli{opacity:.45!important;}
.c-yel .deco,.c-mag .deco{opacity:.1!important;}
.c-yel .x-btn,.c-mag .x-btn{border-color:rgba(0,0,0,.2);color:#0a0a0a;}
.c-yel .f-l,.c-mag .f-l{color:rgba(0,0,0,.32);}
.c-yel .f-v,.c-mag .f-v{color:#0a0a0a;}
.c-yel .d-name,.c-mag .d-name{color:#0a0a0a;}
.c-yel .btn,.c-mag .btn{border-color:rgba(0,0,0,.22);color:#0a0a0a;}
.c-yel .s-cnt,.c-mag .s-cnt{color:rgba(0,0,0,.28);}
.c-yel .d-bot,.c-mag .d-bot{border-top-color:rgba(0,0,0,.1);}
.c-yel .d-facts,.c-mag .d-facts{border-right-color:rgba(0,0,0,.08);}
.c-yel .f-row,.c-mag .f-row{border-bottom-color:rgba(0,0,0,.07);}
.c-yel .p-badge,.c-mag .p-badge{background:rgba(0,0,0,.1);color:#0a0a0a;}
.deco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.13;transition:opacity .4s;}
.sz-open .deco{opacity:.06;}
.p-vert{position:absolute;bottom:36px;left:50%;transform:translateX(-50%) rotate(-90deg);transform-origin:center;white-space:nowrap;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.3);opacity:0;transition:opacity .25s;pointer-events:none;}
.sz-thin .p-vert{opacity:1;}
.p-meta{transition:opacity .3s;}
.sz-thin .p-meta,.sz-open .p-meta{opacity:0;pointer-events:none;}
.p-num{position:absolute;top:28px;right:28px;font-size:10px;font-weight:600;letter-spacing:.12em;color:rgba(255,255,255,.22);}
.p-yr{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:8px;}
.p-cat{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.42);margin-bottom:8px;}
.p-title{font-size:clamp(22px,2.6vw,40px);font-weight:700;line-height:.93;letter-spacing:-.04em;color:#fff;margin-bottom:8px;}
.p-cli{font-size:11px;font-weight:400;color:rgba(255,255,255,.4);}
.p-badge{position:absolute;top:28px;left:32px;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,255,255,.15);color:#fff;padding:3px 8px;border-radius:2px;}
.p-detail{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .32s .12s;}
.sz-open .p-detail{opacity:1;pointer-events:auto;}
.x-btn{position:absolute;top:20px;right:20px;z-index:50;width:30px;height:30px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;border-radius:999px;transition:background .18s;}
.x-btn:hover{background:rgba(255,255,255,.14);}
.d-slider{flex:1;position:relative;overflow:hidden;}
.d-track{display:flex;height:100%;transition:transform .5s cubic-bezier(.77,0,.18,1);}
.d-slide{min-width:100%;height:100%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.18);position:relative;overflow:hidden;}
.d-slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.d-slide:nth-child(2){filter:brightness(.7);}
.d-slide:nth-child(3){filter:brightness(.5);}
.s-cnt{position:absolute;top:20px;right:24px;font-size:10px;font-weight:500;letter-spacing:.1em;color:rgba(255,255,255,.3);z-index:2;}
.d-bot{display:flex;border-top:1px solid rgba(255,255,255,.1);padding:22px 32px;}
.d-facts{flex:1;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.08);padding-right:24px;margin-right:24px;}
.f-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);}
.f-row:last-child{border-bottom:none;}
.f-l{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.3);}
.f-v{font-size:11px;font-weight:600;color:#fff;}
.d-ctrl{display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-width:130px;}
.d-name{font-size:clamp(15px,1.7vw,24px);font-weight:700;letter-spacing:-.035em;line-height:.93;color:#fff;}
.btns{display:flex;gap:7px;}
.btn{width:36px;height:36px;border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;border-radius:4px;transition:background .18s;}
.btn:hover{background:rgba(255,255,255,.14);}
.intro-inner{display:flex;flex-direction:column;justify-content:flex-end;height:100%;opacity:0;transition:opacity .25s .45s;}
.sz-intro .intro-inner{opacity:1;transition:opacity .25s .45s;}
.sz-thin .intro-inner{opacity:0;transition:opacity .1s;}
.i-tag{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:rgba(0,0,0,.35);margin-bottom:20px;}
.i-h1{font-size:clamp(28px,3.2vw,50px);font-weight:700;line-height:.9;letter-spacing:-.045em;color:#0a0a0a;margin-bottom:20px;}
.i-sub{font-size:12px;font-weight:400;line-height:1.65;color:rgba(0,0,0,.38);max-width:210px;}
.i-hint{display:flex;align-items:center;gap:10px;margin-top:32px;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:rgba(0,0,0,.22);}
.h-line{width:30px;height:1px;background:rgba(0,0,0,.15);position:relative;overflow:hidden;}
.h-line::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.4);animation:hl 2s ease-in-out infinite;}
@keyframes hl{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
.i-name-btn{display:inline-block;border-bottom:2px solid transparent;transition:border-color .2s;line-height:inherit;}
.i-name-btn:hover{border-color:rgba(0,0,0,.25);}
.i-smiley{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-size:22px;font-weight:700;color:rgba(0,0,0,.4);opacity:0;transition:opacity .25s;pointer-events:none;}
.i-vert{position:absolute;bottom:36px;left:50%;transform:translateX(-50%) rotate(-90deg);transform-origin:center;white-space:nowrap;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(0,0,0,.35);opacity:0;transition:opacity .25s;pointer-events:none;}
.sz-thin .i-smiley,.sz-thin .i-vert{opacity:1;}
.about-detail{position:absolute;inset:0;display:flex;flex-direction:row;opacity:0;pointer-events:none;transition:opacity .32s .12s;overflow:hidden;}
.sz-open .about-detail{opacity:1;pointer-events:auto;}
.sz-open .intro-inner{opacity:0;pointer-events:none;}
.about-x{position:absolute;top:20px;right:20px;z-index:50;width:30px;height:30px;border:1px solid rgba(0,0,0,.18);background:transparent;color:#0a0a0a;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;border-radius:999px;transition:background .18s;}
.about-x:hover{background:rgba(0,0,0,.07);}
.about-photo{width:42%;flex-shrink:0;height:100%;background:#eae7e0;overflow:hidden;}
.about-photo img{width:100%;height:100%;object-fit:cover;display:block;}
.about-photo-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;}
.about-photo-ph span{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:rgba(0,0,0,.28);}
.about-content{padding:48px 36px 36px;flex:1;overflow-y:auto;scrollbar-width:none;}
.about-content::-webkit-scrollbar{display:none;}
.about-name{font-size:clamp(24px,3vw,38px);font-weight:700;letter-spacing:-.04em;line-height:.92;color:#0a0a0a;margin-bottom:6px;}
.about-role{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:rgba(0,0,0,.35);margin-bottom:28px;}
.timeline{position:relative;margin-bottom:28px;}
.tl-item{display:grid;grid-template-columns:44px 1fr;gap:0 18px;margin-bottom:18px;}
.tl-item:last-child{margin-bottom:0;}
.tl-year{font-size:10px;font-weight:600;letter-spacing:.05em;color:rgba(0,0,0,.3);text-align:right;padding-top:2px;}
.tl-title{font-size:12px;font-weight:700;letter-spacing:-.01em;color:#0a0a0a;margin-bottom:1px;line-height:1.3;}
.tl-sub{font-size:11px;font-weight:400;color:rgba(0,0,0,.42);line-height:1.5;}
.about-social{display:flex;gap:8px;flex-wrap:wrap;padding-top:20px;border-top:1px solid #eee;}
.social-btn{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:600;letter-spacing:.04em;color:#0a0a0a;text-decoration:none;border:1.5px solid #0a0a0a;padding:8px 14px;border-radius:999px;transition:background .18s,color .18s;}
.social-btn:hover{background:#0a0a0a;color:#fff;}
.social-btn svg{width:13px;height:13px;fill:currentColor;flex-shrink:0;}
</style>
</head>
<body>

<div id="cur"></div>

<nav class="nav">
  <div class="nav-logo">hw<span></span></div>
  <ul><li><a href="#" class="on">Arbeit</a></li></ul>
  <a class="nav-hello" id="nav-mail" href="#">Kontakt</a>
</nav>

<div class="strip" id="strip">
  <!-- INTRO / ABOUT — filled by JS -->
  <div class="panel intro-bg sz-intro" id="pi">
    <span class="i-smiley">*</span>
    <span class="i-vert">Übersicht</span>
    <div class="intro-inner">
      <p class="i-tag">Mediendesigner — Köln</p>
      <h1 class="i-h1"><span class="i-name-btn" id="name-btn"></span></h1>
      <p class="i-sub" id="i-sub"></p>
      <div class="i-hint"><div class="h-line"></div>Scroll</div>
    </div>
    <div class="about-detail">
      <button class="about-x" id="about-x">×</button>
      <div class="about-photo" id="about-photo">
        <div class="about-photo-ph">
          <svg width="40" height="40" viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="18" r="9" stroke="rgba(0,0,0,0.22)" stroke-width="1.5" fill="none"/>
            <path d="M6 42c0-9.94 8.06-18 18-18s18 8.06 18 18" stroke="rgba(0,0,0,0.22)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          </svg>
          <span>Foto einsetzen</span>
        </div>
      </div>
      <div class="about-content">
        <h2 class="about-name" id="about-name"></h2>
        <p class="about-role" id="about-role"></p>
        <div class="timeline" id="timeline"></div>
        <div class="about-social" id="about-social"></div>
      </div>
    </div>
  </div>
  <!-- Project panels injected by JS -->
</div>

<script>
(function() {

var DECOS = [
  '<rect x="60" y="80" width="240" height="170" stroke="white" stroke-width="1"/><line x1="60" y1="80" x2="20" y2="40" stroke="white" stroke-width=".7"/><line x1="300" y1="80" x2="340" y2="40" stroke="white" stroke-width=".7"/><line x1="300" y1="250" x2="340" y2="290" stroke="white" stroke-width=".7"/><line x1="60" y1="250" x2="20" y2="290" stroke="white" stroke-width=".7"/><rect x="20" y="40" width="320" height="250" stroke="white" stroke-width=".35" stroke-dasharray="4 8"/>',
  '<circle cx="200" cy="420" r="150" stroke="white" stroke-width="1"/><circle cx="200" cy="420" r="90" stroke="white" stroke-width=".4" stroke-dasharray="3 6"/><circle cx="200" cy="420" r="30" stroke="white" stroke-width=".4"/><line x1="50" y1="420" x2="350" y2="420" stroke="white" stroke-width=".4"/><line x1="200" y1="270" x2="200" y2="570" stroke="white" stroke-width=".4"/>',
  '<polygon points="200,50 350,780 50,780" stroke="white" stroke-width="1" fill="none"/><polygon points="200,150 295,700 105,700" stroke="white" stroke-width=".4" stroke-dasharray="4 7" fill="none"/>',
  '<rect x="40" y="80" width="420" height="300" stroke="white" stroke-width=".8"/><rect x="100" y="140" width="300" height="180" stroke="white" stroke-width=".35" stroke-dasharray="4 8"/><line x1="40" y1="80" x2="100" y2="140" stroke="white" stroke-width=".5"/><line x1="460" y1="80" x2="400" y2="140" stroke="white" stroke-width=".5"/><line x1="460" y1="380" x2="400" y2="320" stroke="white" stroke-width=".5"/><line x1="40" y1="380" x2="100" y2="320" stroke="white" stroke-width=".5"/>',
  '<rect x="50" y="100" width="120" height="170" stroke="white" stroke-width="1" fill="none"/><rect x="200" y="240" width="120" height="170" stroke="white" stroke-width="1" fill="none"/><rect x="90" y="380" width="120" height="170" stroke="white" stroke-width=".4" stroke-dasharray="3 6" fill="none"/>',
  '<path d="M200 70 C 330 70 330 280 200 280 C 70 280 70 490 200 490 C 330 490 330 700 200 700" stroke="white" stroke-width="1" fill="none"/><path d="M200 130 C 290 130 290 280 200 280 C 110 280 110 430 200 430" stroke="white" stroke-width=".4" stroke-dasharray="3 7" fill="none"/>'
];

var DECO_DARK = DECOS.map(function(d) { return d.replace(/stroke="white"/g, 'stroke="black"'); });

// ── LOAD CONTENT ─────────────────────────────────────────────────────────────
fetch('content.json?v=' + Date.now())
  .then(function(r) { return r.json(); })
  .then(function(data) { init(data); })
  .catch(function() {
    // fallback if fetch fails (local file://)
    console.warn('Could not load content.json');
  });

function init(data) {
  var about = data.about;
  var projects = data.projects;

  // Fill about
  document.getElementById('name-btn').innerHTML = about.name.replace(' ', '<br>') + '.';
  document.getElementById('i-sub').textContent = about.tagline;
  document.getElementById('about-name').innerHTML = about.name.replace(' ', '<br>');
  document.getElementById('about-role').textContent = about.role;
  document.getElementById('nav-mail').href = 'mailto:' + about.email;

  if (about.photo) {
    document.getElementById('about-photo').innerHTML = '<img src="' + about.photo + '" alt="' + about.name + '">';
  }

  var tl = document.getElementById('timeline');
  about.timeline.forEach(function(item) {
    tl.innerHTML += '<div class="tl-item"><div class="tl-year">' + item.year + '</div><div class="tl-body"><div class="tl-title">' + item.title + '</div><div class="tl-sub">' + item.subtitle + '</div></div></div>';
  });

  document.getElementById('about-social').innerHTML =
    '<a href="' + about.instagram + '" target="_blank" rel="noopener" class="social-btn"><svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>Instagram</a>' +
    '<a href="mailto:' + about.email + '" class="social-btn"><svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>' + about.email + '</a>';

  // Build project panels
  var strip = document.getElementById('strip');
  projects.forEach(function(p, i) {
    var isLight = p.color === 'c-yel' || p.color === 'c-mag';
    var deco = isLight ? DECO_DARK[i % DECO_DARK.length] : DECOS[i % DECOS.length];
    var slides = p.slides.map(function(s, si) {
      return '<div class="d-slide ' + p.color + '"><span class="s-cnt">' + (si+1) + ' / ' + p.slides.length + '</span>' +
        (p.images && p.images[si] ? '<img src="' + p.images[si] + '" alt="' + s + '">' : '<span>' + s + '</span>') +
        '</div>';
    }).join('');

    var html = '<div class="panel ' + p.color + ' ' + p.size + '" data-i="' + i + '">' +
      '<svg class="deco" viewBox="0 0 500 900" fill="none">' + deco + '</svg>' +
      '<span class="p-num">' + String(i+1).padStart(2,'0') + '</span>' +
      (p.type === 'motion' ? '<span class="p-badge">▶ Motion</span>' : '') +
      '<div class="p-vert">' + p.title + '</div>' +
      '<div class="p-meta"><p class="p-yr">' + p.year + '</p><p class="p-cat">' + p.category + '</p>' +
      '<h2 class="p-title">' + p.title + '</h2><p class="p-cli">' + p.client + '</p></div>' +
      '<div class="p-detail">' +
        '<button class="x-btn" data-x>×</button>' +
        '<div class="d-slider"><div class="d-track" id="t' + i + '">' + slides + '</div></div>' +
        '<div class="d-bot"><div class="d-facts">' +
          '<div class="f-row"><span class="f-l">Kunde</span><span class="f-v">' + p.client + '</span></div>' +
          '<div class="f-row"><span class="f-l">Jahr</span><span class="f-v">' + p.year + '</span></div>' +
          '<div class="f-row"><span class="f-l">Typ</span><span class="f-v">' + p.category + '</span></div>' +
        '</div>' +
        '<div class="d-ctrl"><div class="d-name">' + p.title + '</div>' +
        (p.slides.length > 1 ? '<div class="btns"><button class="btn" data-p="' + i + '">←</button><button class="btn" data-n="' + i + '">→</button></div>' : '') +
        '</div></div></div></div>';

    strip.insertAdjacentHTML('beforeend', html);
  });

  setup(projects.length);
}

function setup(count) {
  var strip   = document.getElementById('strip');
  var panels  = Array.from(document.querySelectorAll('[data-i]'));
  var intro   = document.getElementById('pi');
  var nameBtn = document.getElementById('name-btn');
  var aboutX  = document.getElementById('about-x');
  var defSz   = panels.map(function(p) { return p.className.match(/sz-\w+/)[0]; });
  var slides  = panels.map(function() { return 0; });
  var slideTotals = panels.map(function(_, i) {
    var t = document.getElementById('t'+i);
    return t ? t.children.length : 1;
  });
  var open = -1, introOpen = false;

  function getCol(p) { return p.className.match(/c-\w+/)[0]; }

  function resetAll() {
    introOpen = false; open = -1;
    intro.className = 'panel intro-bg sz-intro';
    panels.forEach(function(p,j) { p.className = 'panel ' + getCol(p) + ' ' + defSz[j]; });
  }

  function openIntro() {
    if (introOpen) { resetAll(); return; }
    introOpen = true; open = -1;
    intro.className = 'panel intro-bg sz-open';
    panels.forEach(function(p) { p.className = 'panel ' + getCol(p) + ' sz-thin'; });
  }

  function openPanel(i) {
    introOpen = false;
    if (open === i) { resetAll(); return; }
    open = i;
    intro.className = 'panel intro-bg sz-thin';
    panels.forEach(function(p,j) {
      p.className = 'panel ' + getCol(p) + (j===i ? ' sz-open' : ' sz-thin');
    });
  }

  nameBtn.addEventListener('click', function(e) { e.stopPropagation(); openIntro(); });
  aboutX.addEventListener('click',  function(e) { e.stopPropagation(); resetAll(); });
  intro.addEventListener('click', function(e) {
    if (e.target.closest('#about-x') || e.target.closest('.i-name-btn')) return;
    if (introOpen) { resetAll(); return; }
    if (open >= 0) resetAll();
  });

  panels.forEach(function(p,i) {
    p.addEventListener('click', function(e) {
      if (e.target.closest('[data-x]') || e.target.closest('.btn')) return;
      openPanel(i);
    });
  });

  document.querySelectorAll('[data-x]').forEach(function(b) {
    b.addEventListener('click', function(e) { e.stopPropagation(); resetAll(); });
  });

  function goSlide(i,d) {
    slides[i] = (slides[i] + d + slideTotals[i]) % slideTotals[i];
    document.getElementById('t'+i).style.transform = 'translateX(-' + (slides[i]*100) + '%)';
  }

  document.querySelectorAll('[data-n]').forEach(function(b) {
    b.addEventListener('click', function(e) { e.stopPropagation(); goSlide(+b.dataset.n, 1); });
  });
  document.querySelectorAll('[data-p]').forEach(function(b) {
    b.addEventListener('click', function(e) { e.stopPropagation(); goSlide(+b.dataset.p, -1); });
  });

  window.addEventListener('wheel', function(e) {
    e.preventDefault();
    var delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    strip.scrollLeft += delta * 1.2;
  }, { passive: false });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') resetAll();
    if (open >= 0 && e.key === 'ArrowRight') goSlide(open, 1);
    if (open >= 0 && e.key === 'ArrowLeft')  goSlide(open, -1);
  });
}

// ── CURSOR ───────────────────────────────────────────────────────────────────
var cur = document.getElementById('cur');
var mx = -100, my = -100, raf;
document.addEventListener('mousemove', function(e) {
  mx = e.clientX; my = e.clientY;
  if (!raf) raf = requestAnimationFrame(function() {
    cur.style.transform = 'translate(' + (mx-6) + 'px,' + (my-6) + 'px)';
    raf = null;
  });
});

})();
</script>
</body>
</html>
