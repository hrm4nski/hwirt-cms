<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hermann Wirt — Mediendesigner Köln</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--font:'Instrument Sans',sans-serif;--dark:#0a0a0a;}
html{background:var(--dark);}
body{font-family:var(--font);background:var(--dark);min-height:100svh;overflow-x:hidden;}

/* NAV */
.nav{
  position:fixed;top:0;left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:52px;
  background:rgba(10,10,10,.95);
  backdrop-filter:blur(12px);
  z-index:100;
  border-bottom:1px solid rgba(255,255,255,.07);
}
.nav-logo{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.03em;display:flex;align-items:center;gap:4px;}
.nav-logo-dot{width:7px;height:7px;border-radius:50%;background:#fff;}
.nav-contact{font-size:12px;font-weight:600;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.2);padding:6px 14px;border-radius:999px;text-decoration:none;}

/* SCROLL CONTAINER */
.feed{padding-top:52px;}

/* INTRO CARD */
.intro-card{
  padding:40px 24px 36px;
  min-height:55vw;
  display:flex;flex-direction:column;justify-content:flex-end;
  background:#fff;
  position:relative;
}
.intro-tag{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:rgba(0,0,0,.35);margin-bottom:16px;}
.intro-h1{font-size:clamp(38px,11vw,60px);font-weight:700;line-height:.9;letter-spacing:-.045em;color:#0a0a0a;margin-bottom:14px;}
.intro-sub{font-size:13px;font-weight:400;line-height:1.6;color:rgba(0,0,0,.4);max-width:260px;}
.intro-name-btn{border-bottom:2px solid transparent;transition:border-color .2s;display:inline;}
.intro-name-btn:active{border-color:rgba(0,0,0,.25);}

/* PROJECT CARDS */
.project-card{
  position:relative;
  padding:28px 24px;
  min-height:48vw;
  display:flex;flex-direction:column;justify-content:flex-end;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
.project-card:active{opacity:.9;}

.card-num{position:absolute;top:18px;right:20px;font-size:10px;font-weight:600;letter-spacing:.12em;color:rgba(255,255,255,.3);}
.card-cat{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:6px;}
.card-title{font-size:clamp(26px,8vw,40px);font-weight:700;line-height:.93;letter-spacing:-.04em;color:#fff;margin-bottom:6px;}
.card-client{font-size:11px;font-weight:400;color:rgba(255,255,255,.4);}

/* light panels */
.light .card-num{color:rgba(0,0,0,.25);}
.light .card-cat{color:rgba(0,0,0,.4);}
.light .card-title{color:#0a0a0a;}
.light .card-client{color:rgba(0,0,0,.4);}

/* FULLSCREEN OVERLAY */
.overlay{
  position:fixed;inset:0;z-index:300;
  display:flex;flex-direction:column;
  transform:translateY(100%);
  transition:transform .45s cubic-bezier(.77,0,.18,1);
  overflow:hidden;
}
.overlay.open{transform:translateY(0);}

/* drag handle */
.drag-handle{
  width:36px;height:4px;border-radius:2px;
  background:rgba(255,255,255,.3);
  margin:12px auto 0;
  flex-shrink:0;
}
.overlay.light-overlay .drag-handle{background:rgba(0,0,0,.2);}

/* SLIDER */
.ov-slider{flex:1;position:relative;overflow:hidden;min-height:0;}
.ov-track{display:flex;height:100%;transition:transform .45s cubic-bezier(.77,0,.18,1);}
.ov-slide{
  min-width:100%;height:100%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,.2);position:relative;overflow:hidden;
}
.ov-slide.light-slide{color:rgba(0,0,0,.15);}
.ov-slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.ov-slide:nth-child(2){filter:brightness(.75);}
.ov-slide:nth-child(3){filter:brightness(.55);}
.slide-cnt{position:absolute;top:16px;right:18px;font-size:10px;font-weight:500;letter-spacing:.1em;color:rgba(255,255,255,.35);z-index:2;}
.light-overlay .slide-cnt{color:rgba(0,0,0,.28);}

/* SLIDER DOTS */
.ov-dots{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:14px 0;flex-shrink:0;
}
.ov-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);transition:all .2s;}
.ov-dot.act{background:#fff;width:18px;border-radius:3px;}
.light-overlay .ov-dot{background:rgba(0,0,0,.2);}
.light-overlay .ov-dot.act{background:rgba(0,0,0,.7);}

/* PROJECT INFO */
.ov-info{
  padding:20px 24px 32px;
  border-top:1px solid rgba(255,255,255,.1);
  flex-shrink:0;
}
.light-overlay .ov-info{border-top-color:rgba(0,0,0,.1);}
.ov-title{font-size:24px;font-weight:700;letter-spacing:-.03em;color:#fff;margin-bottom:16px;line-height:1.1;}
.light-overlay .ov-title{color:#0a0a0a;}
.ov-facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.ov-fact-l{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:2px;}
.light-overlay .ov-fact-l{color:rgba(0,0,0,.35);}
.ov-fact-v{font-size:13px;font-weight:600;color:#fff;}
.light-overlay .ov-fact-v{color:#0a0a0a;}

/* ABOUT OVERLAY */
.about-overlay{
  position:fixed;inset:0;z-index:300;
  background:#fff;
  display:flex;flex-direction:column;
  transform:translateY(100%);
  transition:transform .45s cubic-bezier(.77,0,.18,1);
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.about-overlay.open{transform:translateY(0);}
.about-handle{width:36px;height:4px;border-radius:2px;background:rgba(0,0,0,.15);margin:12px auto 0;flex-shrink:0;}
.about-photo{width:100%;aspect-ratio:4/3;background:#eae7e0;flex-shrink:0;overflow:hidden;}
.about-photo img{width:100%;height:100%;object-fit:cover;display:block;}
.about-photo-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;}
.about-photo-ph span{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:rgba(0,0,0,.28);}
.about-body{padding:28px 24px 48px;}
.about-name{font-size:clamp(28px,9vw,44px);font-weight:700;letter-spacing:-.04em;line-height:.92;color:#0a0a0a;margin-bottom:6px;}
.about-role{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:rgba(0,0,0,.35);margin-bottom:28px;}
.tl-item{display:grid;grid-template-columns:44px 1fr;gap:0 16px;margin-bottom:18px;}
.tl-item:last-child{margin-bottom:0;}
.tl-year{font-size:10px;font-weight:600;color:rgba(0,0,0,.3);text-align:right;padding-top:2px;}
.tl-title{font-size:13px;font-weight:700;color:#0a0a0a;margin-bottom:2px;line-height:1.3;}
.tl-sub{font-size:11px;font-weight:400;color:rgba(0,0,0,.42);line-height:1.5;}
.about-social{display:flex;gap:8px;flex-wrap:wrap;padding-top:24px;border-top:1px solid #eee;margin-top:24px;}
.social-btn{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:600;color:#0a0a0a;text-decoration:none;border:1.5px solid #0a0a0a;padding:9px 16px;border-radius:999px;}
.social-btn svg{width:13px;height:13px;fill:currentColor;}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">hw<div class="nav-logo-dot"></div></div>
  <a class="nav-contact" id="nav-contact" href="#">Kontakt</a>
</nav>

<div class="feed">
  <div class="intro-card">
    <p class="intro-tag">Mediendesigner — Köln</p>
    <h1 class="intro-h1"><span class="intro-name-btn" id="name-btn"></span></h1>
    <p class="intro-sub" id="intro-sub"></p>
  </div>
  <div id="cards"></div>
</div>

<!-- PROJECT OVERLAY -->
<div class="overlay" id="proj-overlay">
  <div class="drag-handle" id="proj-handle"></div>
  <div class="ov-slider">
    <div class="ov-track" id="ov-track"></div>
  </div>
  <div class="ov-dots" id="ov-dots"></div>
  <div class="ov-info" id="ov-info"></div>
</div>

<!-- ABOUT OVERLAY -->
<div class="about-overlay" id="about-overlay">
  <div class="about-handle" id="about-handle"></div>
  <div class="about-photo" id="about-photo">
    <div class="about-photo-ph">
      <svg width="36" height="36" viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="18" r="9" stroke="rgba(0,0,0,0.22)" stroke-width="1.5" fill="none"/>
        <path d="M6 42c0-9.94 8.06-18 18-18s18 8.06 18 18" stroke="rgba(0,0,0,0.22)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </svg>
      <span>Foto einsetzen</span>
    </div>
  </div>
  <div class="about-body">
    <h2 class="about-name" id="about-name"></h2>
    <p class="about-role" id="about-role"></p>
    <div id="about-timeline"></div>
    <div class="about-social" id="about-social"></div>
  </div>
</div>

<script>
var LIGHT_COLORS = ['c-yel','c-mag'];
function isLight(color) {
  if (LIGHT_COLORS.indexOf(color) > -1) return true;
  if (color && color.startsWith('#')) {
    var r=parseInt(color.slice(1,3),16),g=parseInt(color.slice(3,5),16),b=parseInt(color.slice(5,7),16);
    return (r*299+g*587+b*114)/1000 > 155;
  }
  return false;
}

var COLOR_MAP = {'c-org':'#ea3398','c-pur':'#05B2FC','c-yel':'#F0E030','c-blu':'#cd394a','c-lim':'#2c55f6','c-mag':'#c5fd61'};
function resolveColor(c) { return COLOR_MAP[c] || c; }

var projOverlay = document.getElementById('proj-overlay');
var aboutOverlay = document.getElementById('about-overlay');
var currentSlide = 0;
var currentSlides = [];

// ── LOAD ─────────────────────────────────────────────────────────────────────
fetch('content.json?v=' + Date.now())
  .then(function(r){return r.json();})
  .then(function(data){init(data);});

function init(data) {
  var about = data.about;
  var projects = data.projects;

  // Nav
  document.getElementById('nav-contact').href = 'mailto:' + about.email;

  // Intro
  document.getElementById('name-btn').innerHTML = about.name.replace(' ','<br>') + '.';
  document.getElementById('intro-sub').textContent = about.tagline;

  // About overlay
  if (about.photo) {
    document.getElementById('about-photo').innerHTML = '<img src="'+about.photo+'" alt="'+about.name+'">';
  }
  document.getElementById('about-name').innerHTML = about.name.replace(' ','<br>');
  document.getElementById('about-role').textContent = about.role;
  var tl = document.getElementById('about-timeline');
  about.timeline.forEach(function(item) {
    tl.innerHTML += '<div class="tl-item"><div class="tl-year">'+item.year+'</div><div><div class="tl-title">'+item.title+'</div><div class="tl-sub">'+item.subtitle+'</div></div></div>';
  });
  document.getElementById('about-social').innerHTML =
    '<a href="'+about.instagram+'" target="_blank" class="social-btn"><svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>Instagram</a>' +
    '<a href="mailto:'+about.email+'" class="social-btn"><svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'+about.email+'</a>';

  // Project cards
  var cards = document.getElementById('cards');
  projects.forEach(function(p, i) {
    var light = isLight(p.color);
    var bg = resolveColor(p.color);
    var div = document.createElement('div');
    div.className = 'project-card' + (light ? ' light' : '');
    div.style.background = bg;
    div.innerHTML =
      '<span class="card-num">'+String(i+1).padStart(2,'0')+'</span>'+
      '<p class="card-cat">'+p.category+'</p>'+
      '<h2 class="card-title">'+p.title+'</h2>'+
      '<p class="card-client">'+p.client+' · '+p.year+'</p>';
    div.addEventListener('click', function(){openProject(p, light, bg);});
    cards.appendChild(div);
  });

  // About trigger
  document.getElementById('name-btn').addEventListener('click', function(e){
    e.stopPropagation();
    openAbout();
  });
}

// ── PROJECT OVERLAY ───────────────────────────────────────────────────────────
function openProject(p, light, bg) {
  projOverlay.style.background = bg;
  projOverlay.className = 'overlay' + (light ? ' light-overlay' : '');

  currentSlide = 0;
  currentSlides = p.slides || [];

  // Build slides
  var track = document.getElementById('ov-track');
  track.innerHTML = '';
  track.style.transform = 'translateX(0)';

  currentSlides.forEach(function(s, i) {
    var caption = typeof s === 'object' ? (s.caption||'') : s;
    var image   = typeof s === 'object' ? (s.image||'') : '';
    var slide = document.createElement('div');
    slide.className = 'ov-slide' + (light ? ' light-slide' : '');
    slide.style.background = bg;
    slide.innerHTML = '<span class="slide-cnt">'+(i+1)+' / '+currentSlides.length+'</span>' +
      (image ? '<img src="'+image+'" alt="'+caption+'">' : '<span>'+caption+'</span>');
    track.appendChild(slide);
  });

  // Dots
  var dots = document.getElementById('ov-dots');
  dots.innerHTML = '';
  currentSlides.forEach(function(_, i) {
    var d = document.createElement('div');
    d.className = 'ov-dot' + (i===0?' act':'');
    d.onclick = function(){goSlide(i);};
    dots.appendChild(d);
  });

  // Info
  document.getElementById('ov-info').innerHTML =
    '<div class="ov-title">'+p.title+'</div>'+
    '<div class="ov-facts">'+
      '<div><div class="ov-fact-l">Kunde</div><div class="ov-fact-v">'+p.client+'</div></div>'+
      '<div><div class="ov-fact-l">Jahr</div><div class="ov-fact-v">'+p.year+'</div></div>'+
      '<div><div class="ov-fact-l">Typ</div><div class="ov-fact-v">'+p.category+'</div></div>'+
    '</div>';

  requestAnimationFrame(function(){
    projOverlay.classList.add('open');
  });
  document.body.style.overflow = 'hidden';
  setupDrag(projOverlay, closeProject, 'proj-handle');
}

function closeProject() {
  projOverlay.classList.remove('open');
  document.body.style.overflow = '';
}

function goSlide(n) {
  currentSlide = Math.max(0, Math.min(n, currentSlides.length-1));
  document.getElementById('ov-track').style.transform = 'translateX(-'+(currentSlide*100)+'%)';
  document.querySelectorAll('.ov-dot').forEach(function(d,i){
    d.classList.toggle('act', i===currentSlide);
  });
}

// ── ABOUT OVERLAY ─────────────────────────────────────────────────────────────
function openAbout() {
  requestAnimationFrame(function(){
    aboutOverlay.classList.add('open');
  });
  document.body.style.overflow = 'hidden';
  setupDrag(aboutOverlay, closeAbout, 'about-handle');
}

function closeAbout() {
  aboutOverlay.classList.remove('open');
  document.body.style.overflow = '';
}

// ── SWIPE TO CLOSE ────────────────────────────────────────────────────────────
function setupDrag(overlay, closeFn, handleId) {
  var handle = document.getElementById(handleId);
  var startY = 0, curY = 0, dragging = false;

  function onStart(e) {
    startY = e.touches ? e.touches[0].clientY : e.clientY;
    curY = 0;
    dragging = true;
    overlay.style.transition = 'none';
  }

  function onMove(e) {
    if (!dragging) return;
    var y = (e.touches ? e.touches[0].clientY : e.clientY) - startY;
    if (y < 0) return;
    curY = y;
    overlay.style.transform = 'translateY('+y+'px)';
  }

  function onEnd() {
    if (!dragging) return;
    dragging = false;
    overlay.style.transition = '';
    if (curY > 80) {
      overlay.style.transform = '';
      closeFn();
    } else {
      overlay.style.transform = 'translateY(0)';
    }
  }

  // Remove old listeners by cloning
  var newHandle = handle.cloneNode(true);
  handle.parentNode.replaceChild(newHandle, handle);
  newHandle.addEventListener('touchstart', onStart, {passive:true});
  newHandle.addEventListener('touchmove', onMove, {passive:true});
  newHandle.addEventListener('touchend', onEnd);
}
</script>
</body>
</html>
